name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Build APK
        working-directory: ./ColourPixelAndroid
        run: gradle --no-daemon assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ColourPixel-APK
          path: ColourPixelAndroid/app/build/outputs/apk/debug/app-debug.apk
